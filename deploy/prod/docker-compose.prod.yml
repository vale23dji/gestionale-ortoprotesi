services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ortoprotesi-sql
    env_file:
      - .env.prod
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    # NIENTE porta esposta in prod; usa 'exec' per sqlcmd
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - ortoprotesi-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      retries: 15
      start_period: 10s
      timeout: 5s
    restart: always

  api:
    build:
      context: ../..                   # root repo
      dockerfile: OrtoProtesiApi/Dockerfile
    container_name: ortoprotesi-api
    env_file:
      - .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ortoprotesi;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      Jwt__Key: ${JWT_KEY}
      ASPNETCORE_URLS: "http://+:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/wwwroot/uploads
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - ortoprotesi-network
    # NIENTE porta esposta in prod (sarà dietro al reverse proxy)
    restart: always

  frontend:
    build:
      context: ../..                   # root repo (necessario per i COPY del Dockerfile)
      dockerfile: ./orto-protesi/Dockerfile
    container_name: ortoprotesi-frontend
    networks:
      - ortoprotesi-network
    depends_on:
      - api
    # NIENTE porta esposta: il reverse proxy fa da entrypoint
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ortoprotesi-nginx
    env_file:
      - .env.prod
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"                        # <— aggiunto
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot     # <— webroot ACME
      - letsencrypt:/etc/letsencrypt     # <— cert e chiavi
    networks:
      - ortoprotesi-network
    restart: always

volumes:
  mssql_data:
  uploads:
  dataprotection_keys:
  certbot-www:                           # <— aggiunto
  letsencrypt:                           # <— aggiunto

networks:
  ortoprotesi-network:

