<div class="password-container">
  <h2>Cambia password</h2>

  <form (ngSubmit)="cambiaPassword()">
    <!-- Attuale -->
    <label>Password attuale:</label>
    <div class="input-wrapper">
      <input
        [type]="showAttuale ? 'text' : 'password'"
        [(ngModel)]="attuale"
        name="attuale"
        required
      />
      <div class="show-password">
        <input
          type="checkbox"
          [checked]="showAttuale"
          (change)="toggleShowAttuale()"
          id="showAttuale"
        />
        <label for="showAttuale">Mostra</label>
      </div>
    </div>

    <!-- Nuova -->
    <label>Nuova password:</label>
    <div class="input-wrapper">
      <input
        [type]="showNuova ? 'text' : 'password'"
        [(ngModel)]="nuova"
        name="nuova"
        required
      />
      <div class="show-password">
        <input
          type="checkbox"
          [checked]="showNuova"
          (change)="toggleShowNuova()"
          id="showNuova"
        />
        <label for="showNuova">Mostra</label>
      </div>
    </div>

    <!-- Conferma -->
    <label>Conferma nuova password:</label>
    <div class="input-wrapper">
      <input
        [type]="showConferma ? 'text' : 'password'"
        [(ngModel)]="conferma"
        name="conferma"
        required
      />
      <div class="show-password">
        <input
          type="checkbox"
          [checked]="showConferma"
          (change)="toggleShowConferma()"
          id="showConferma"
        />
        <label for="showConferma">Mostra</label>
      </div>
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Attendi...' : 'Cambia password' }}
    </button>
  </form>

  <p *ngIf="messaggio" [ngClass]="{ 'success': !errore, 'error': errore }">
    {{ messaggio }}
  </p>
</div>
