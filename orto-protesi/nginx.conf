#Gestisce il routing SPA: Angular è un'applicazione a pagina singola (SPA), quindi tutte le richieste che non corrispondono a file statici esistenti devono essere indirizzate a index.html per permettere al router di Angular di gestire correttamente i percorsi.
#Ottimizza le performance:
#Attiva la compressione gzip per ridurre la dimensione dei file trasferiti
#Imposta headers di cache per i file statici (immagini, CSS, JS) per migliorare i tempi di caricamento per i visitatori che ritornano
#Migliora la sicurezza: Aggiunge intestazioni HTTP di sicurezza per proteggere da alcune vulnerabilità web comuni.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- GZIP ---
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript application/xml image/svg+xml;

    # --- Cache: asset statici ---
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000" always;
    }

    # Non cache-are HTML (index.html)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    } 

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

